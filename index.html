<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)">
<title>Karing</title>
<style>
:root {
  --bg: #f3f3f6;
  --surface: #ffffff;
  --ink: #14141b;
  --muted: #6a6f80;
  --line: #e4e5eb;
  --accent: #d7263d;
  --accent-fill: #d7263d;
  --accent-deep: #a01329;
  --accent-soft: #fde9ec;
  --ok: #15985a;
  --shadow: 0 1px 2px rgba(20, 20, 40, 0.05), 0 10px 28px rgba(20, 20, 40, 0.07);
  --fs: clamp(15px, 4.2vw, 17px);
  --pad: clamp(16px, 5.2vw, 24px);
  --gap: clamp(10px, 3vw, 14px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0e12;
    --surface: #161820;
    --ink: #eef0f6;
    --muted: #9097a8;
    --line: #252932;
    --accent: #ff5568;
    --accent-fill: #e0364b;
    --accent-deep: #a8182c;
    --accent-soft: #2b1519;
    --ok: #34c47c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35);
  }
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, sans-serif;
  font-size: var(--fs);
  line-height: 1.85;
}
svg.ic {
  width: 1.35em;
  height: 1.35em;
  flex: 0 0 auto;
}
.page {
  max-width: 560px;
  min-height: 100vh;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--pad) calc(env(safe-area-inset-bottom, 0px) + 36px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: clamp(16px, 5vw, 24px);
}
.brand-text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-width: 0;
  line-height: 1.5;
}
.brand-text .by {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 2px;
}
.brand-text .byline {
  margin: 0;
}
.avatar {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--line);
  background: var(--surface);
}
.logo {
  flex: 0 0 auto;
  width: 58px;
  height: 58px;
  border-radius: 18px;
  object-fit: cover;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.mark {
  flex: 0 0 auto;
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  border-radius: 18px;
  background: linear-gradient(140deg, var(--accent-fill), var(--accent-deep));
  color: #ffffff;
}
.mark svg.ic {
  width: 28px;
  height: 28px;
}
.brand-name {
  font-weight: 800;
  font-size: 1.35em;
  line-height: 1.4;
  direction: ltr;
}
.brand + .lead {
  margin-top: 0;
}
.h-title {
  margin: 0;
  font-size: clamp(26px, 8.4vw, 36px);
  line-height: 1.45;
  font-weight: 800;
}
.byline {
  margin: 2px 0 0;
  font-size: 0.86em;
  color: var(--muted);
}
.lead {
  margin: clamp(12px, 3.6vw, 18px) 0 0;
  color: var(--muted);
}
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 50px;
  margin: clamp(20px, 6vw, 28px) 0 var(--gap);
  padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--muted);
}
.search:focus-within {
  border-color: var(--accent);
}
.search input {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
}
.search input::placeholder {
  color: var(--muted);
}
.list {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}
.card {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  color: var(--ink);
  text-decoration: none;
  transition: transform 0.12s ease;
}
.card:active {
  transform: scale(0.985);
}
.card .ico {
  flex: 0 0 auto;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--accent-soft);
  color: var(--accent);
}
.card .ico svg.ic {
  width: 24px;
  height: 24px;
}
.card .body {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.card .name {
  font-weight: 700;
  line-height: 1.6;
}
.card .sub {
  font-size: 0.82em;
  line-height: 1.6;
  color: var(--muted);
}
.chip {
  flex: 0 0 auto;
  padding: 1px 10px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
  font-size: 0.76em;
  font-weight: 600;
  white-space: nowrap;
}
.tick {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--ok);
  color: #ffffff;
}
.tick svg.ic {
  width: 14px;
  height: 14px;
  stroke-width: 3;
}
.chev {
  flex: 0 0 auto;
  color: var(--muted);
  display: grid;
}
.card.primary {
  border: 0;
  background: linear-gradient(140deg, var(--accent-fill), var(--accent-deep));
  color: #ffffff;
  box-shadow: 0 12px 30px rgba(160, 19, 41, 0.28);
}
.card.primary .ico {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
}
.card.primary .sub {
  color: rgba(255, 255, 255, 0.85);
}
.card.primary .chip {
  background: rgba(255, 255, 255, 0.2);
  color: #ffffff;
}
.card.primary .chev {
  color: rgba(255, 255, 255, 0.85);
}
.card.resume {
  border-inline-start: 4px solid var(--accent-fill);
}
.empty {
  margin: 28px 0;
  text-align: center;
  color: var(--muted);
}
.reset {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 28px auto 0;
  padding: 10px 20px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 0.86em;
  font-weight: 600;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.reset svg.ic {
  width: 1.2em;
  height: 1.2em;
}
.reset:active {
  transform: scale(0.97);
}
.reset.confirm {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}
.topline {
  display: flex;
  margin-bottom: clamp(18px, 5vw, 26px);
}
.icon-btn {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}
.hero-ico {
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin-bottom: 18px;
  border-radius: 22px;
  background: var(--accent-soft);
  color: var(--accent);
}
.hero-ico svg.ic {
  width: 32px;
  height: 32px;
}
.menu-list {
  margin-top: clamp(20px, 6vw, 28px);
}
.view {
  max-width: 560px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 10px;
}
.bar-title {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  line-height: 1.5;
}
.bt {
  font-weight: 700;
  font-size: 0.95em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bs {
  font-size: 0.8em;
  color: var(--muted);
}
.progress {
  flex: 0 0 auto;
  height: 4px;
  margin: 0 var(--pad);
  border-radius: 4px;
  background: var(--line);
  overflow: hidden;
}
.progress i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 4px;
  background: var(--accent-fill);
  transition: width 0.3s ease;
}
.slide {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.slide.in-next {
  animation: in-next 0.28s ease;
}
.slide.in-prev {
  animation: in-prev 0.28s ease;
}
@keyframes in-next {
  from { opacity: 0; transform: translateX(-26px); }
  to { opacity: 1; transform: none; }
}
@keyframes in-prev {
  from { opacity: 0; transform: translateX(26px); }
  to { opacity: 1; transform: none; }
}
.step {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 16px 0 14px;
}
.cap {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 0 var(--pad) 14px;
  font-size: clamp(14px, 3.95vw, 16.5px);
  line-height: 1.8;
}
.cap p {
  margin: 0;
}
.badge {
  flex: 0 0 auto;
  min-width: 28px;
  height: 28px;
  margin-top: 1px;
  padding: 0 7px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: var(--accent-fill);
  color: #ffffff;
  font-size: 0.82em;
  font-weight: 700;
  line-height: 1;
}
.stage {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  margin: 0 var(--pad);
}
.fit {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fit.loading::before {
  content: "";
  position: absolute;
  width: 30px;
  height: 30px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.shot {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow);
  opacity: 0;
  transition: opacity 0.25s ease;
  cursor: zoom-in;
}
.shot.ready {
  opacity: 1;
}
.missing {
  display: grid;
  place-items: center;
  height: min(100%, 460px);
  aspect-ratio: 9 / 16;
  max-width: 100%;
  padding: 14px;
  border: 2px dashed var(--line);
  border-radius: 18px;
  color: var(--muted);
  font-size: 0.8em;
  text-align: center;
  direction: ltr;
  word-break: break-all;
}
.intro {
  margin: auto 0;
  padding: 24px var(--pad);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.intro .lead {
  margin-top: 14px;
}
.intro .chip {
  margin-top: 16px;
  padding: 3px 12px;
  background: var(--accent-soft);
  color: var(--accent);
}
.intro-fit {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 18px;
}
.intro-fit .shot {
  max-height: 44vh;
}
.actions {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}
.actions .btn {
  flex: 1 1 150px;
  min-height: 46px;
  padding: 0 12px;
  font-size: 0.86em;
  white-space: nowrap;
}
.outro {
  margin: auto 0;
  padding: 24px var(--pad);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.done-ring {
  width: 96px;
  height: 96px;
  margin-bottom: 18px;
  stroke: var(--ok);
  stroke-width: 4;
}
.done-ring circle {
  stroke-dasharray: 176;
  stroke-dashoffset: 176;
  animation: draw 0.7s ease forwards;
}
.done-ring path {
  stroke-dasharray: 40;
  stroke-dashoffset: 40;
  animation: draw 0.4s ease 0.55s forwards;
}
@keyframes draw {
  to { stroke-dashoffset: 0; }
}
.outro h2 {
  margin: 0;
  font-size: clamp(19px, 5.6vw, 24px);
  line-height: 1.7;
  font-weight: 800;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: clamp(46px, 12.5vw, 52px);
  padding: 0 20px;
  border: 0;
  border-radius: 15px;
  background: var(--accent-fill);
  color: #ffffff;
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.12s ease;
}
.btn:active {
  transform: scale(0.98);
}
.btn.ghost {
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--ink);
}
.btn.off {
  opacity: 0.45;
  pointer-events: none;
}
.dock {
  flex: 0 0 auto;
  display: flex;
  gap: 10px;
  padding: 12px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 14px);
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.dock.col {
  flex-direction: column;
}
.dock .grow {
  flex: 1 1 auto;
}
.dock .sq {
  width: clamp(46px, 12.5vw, 52px);
  padding: 0;
}
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: rgba(0, 0, 0, 0.93);
  cursor: zoom-out;
}
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 12px;
}
a:focus-visible, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
@media (min-width: 600px) {
  .view {
    border-inline: 1px solid var(--line);
    background: var(--bg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .slide.in-next, .slide.in-prev, .fit.loading::before { animation: none; }
  .done-ring circle, .done-ring path { animation: none; stroke-dashoffset: 0; }
  .progress i, .card, .btn, .shot { transition: none; }
}
</style>
</head>

var root = document.getElementById("root");
var nav = null;

function ic(name) {
  return "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">" + ICONS[name] + "</svg>";
}

function fa(n) {
  return Number(n).toLocaleString("fa-IR", { useGrouping: false });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c];
  });
}

function norm(s) {
  return String(s).replace(/\u064a/g, "\u06cc").replace(/\u0643/g, "\u06a9").replace(/\u200c/g, " ").toLowerCase().trim();
}

function logoSrc(name, extIndex) {
  return SITE.imageDir + "/" + name + "." + SITE.imageExts[extIndex];
}

function setFavicon(i) {
  if (i >= SITE.imageExts.length) { return; }
  var probe = new Image();
  probe.onload = function () {
    var link = document.createElement("link");
    link.rel = "icon";
    link.href = logoSrc(SITE.logo, i);
    document.head.appendChild(link);
  };
  probe.onerror = function () { setFavicon(i + 1); };
  probe.src = logoSrc(SITE.logo, i);
}

function imgSrc(prefix, n, extIndex) {
  return SITE.imageDir + "/" + prefix + "-" + n + "." + SITE.imageExts[extIndex];
}

var store = {
  read: function () {
    try {
      var d = JSON.parse(localStorage.getItem("karing-progress"));
      if (d && d.done && d.last) { return d; }
    } catch (e) {
      return { done: {}, last: {}, lastKey: "" };
    }
    return { done: {}, last: {}, lastKey: "" };
  },
  write: function (d) {
    try { localStorage.setItem("karing-progress", JSON.stringify(d)); } catch (e) {
      return;
    }
  },
  clear: function () {
    try { localStorage.removeItem("karing-progress"); } catch (e) {
      return;
    }
  }
};

function leaves() {
  var out = [];
  PAGES.forEach(function (p, i) {
    if (p.children) {
      p.children.forEach(function (c) {
        out.push({ key: p.id + "/" + c.id, page: c, parent: p, index: i });
      });
    } else {
      out.push({ key: p.id, page: p, parent: null, index: i });
    }
  });
  return out;
}

function card(page, key, extra) {
  var d = store.read();
  var done = !!d.done[key];
  return "<a class=\"card" + (extra ? " " + extra : "") + "\" href=\"#/" + key + "\">" +
    "<span class=\"ico\">" + ic(page.icon) + "</span>" +
    "<span class=\"body\"><span class=\"name\">" + esc(page.title) + "</span><span class=\"sub\">" + esc(page.desc) + "</span></span>" +
    (done ? "<span class=\"tick\">" + ic("check") + "</span>" : "") +
    "<span class=\"chev\">" + ic("chevL") + "</span></a>";
}

function listHtml(q) {
  var d = store.read();
  var html = "";
  if (q && norm(q)) {
    var nq = norm(q);
    var found = leaves().filter(function (e) {
      return norm(e.page.title + " " + e.page.desc + " " + e.page.id).indexOf(nq) !== -1;
    });
    if (!found.length) {
      return "<p class=\"empty\">آموزشی پیدا نشد. عبارت دیگری را امتحان کن.</p>";
    }
    return found.map(function (e) { return card(e.page, e.key, ""); }).join("");
  }
  if (d.lastKey && !d.done[d.lastKey] && d.last[d.lastKey] > 0) {
    var hit = leaves().filter(function (e) { return e.key === d.lastKey; })[0];
    if (hit) {
      var step = d.last[d.lastKey];
      html += "<a class=\"card resume\" href=\"#/" + hit.key + "/" + step + "\">" +
        "<span class=\"ico\">" + ic(hit.page.icon) + "</span>" +
        "<span class=\"body\"><span class=\"name\">ادامه: " + esc(hit.page.title) + "</span><span class=\"sub\">مرحله " + fa(step) + " از " + fa(hit.page.steps.length) + "</span></span>" +
        "<span class=\"chev\">" + ic("chevL") + "</span></a>";
    }
  }
  PAGES.forEach(function (p, i) {
    html += card(p, p.id, i === 0 && !d.done[p.id] ? "primary" : "");
  });
  return html;
}

function renderHome() {
  var d = store.read();
  var hasProgress = Object.keys(d.done).length > 0 || !!d.lastKey;
  root.innerHTML =
    "<div class=\"page\">" +
    "<div class=\"brand\"><img class=\"logo\" data-name=\"" + SITE.logo + "\" data-ext=\"0\" src=\"" + logoSrc(SITE.logo, 0) + "\" alt=\"" + esc(SITE.brand) + "\"><div class=\"brand-text\"><span class=\"brand-name\">" + esc(SITE.brand) + "</span><span class=\"by\"><img class=\"avatar\" data-name=\"" + SITE.channelLogo + "\" data-ext=\"0\" src=\"" + logoSrc(SITE.channelLogo, 0) + "\" alt=\"\"><span class=\"byline\">" + esc(SITE.author) + "</span></span></div></div>" +
    "<p class=\"lead\">" + esc(SITE.intro) + "</p>" +
    "<label class=\"search\">" + ic("search") + "<input id=\"q\" type=\"search\" placeholder=\"جستجو در آموزش‌ها\" autocomplete=\"off\" enterkeyhint=\"search\"></label>" +
    "<div class=\"list\" id=\"list\">" + listHtml("") + "</div>" +
    (hasProgress ? "<button class=\"reset\" id=\"reset\" type=\"button\">" + ic("trash") + "<span>پاک کردن پیشرفت</span></button>" : "") +
    "</div>";
  document.getElementById("q").addEventListener("input", function (e) {
    document.getElementById("list").innerHTML = listHtml(e.target.value);
  });
  var reset = document.getElementById("reset");
  if (reset) {
    var timer = null;
    reset.addEventListener("click", function () {
      if (!reset.classList.contains("confirm")) {
        reset.classList.add("confirm");
        reset.querySelector("span").textContent = "برای تأیید دوباره بزن";
        timer = setTimeout(function () {
          reset.classList.remove("confirm");
          reset.querySelector("span").textContent = "پاک کردن پیشرفت";
        }, 3000);
        return;
      }
      clearTimeout(timer);
      store.clear();
      renderHome();
    });
  }
}

function renderMenu(page) {
  root.innerHTML =
    "<div class=\"page\">" +
    "<div class=\"topline\"><a class=\"icon-btn\" href=\"#/\" aria-label=\"بازگشت\">" + ic("chevR") + "</a></div>" +
    "<span class=\"hero-ico\">" + ic(page.icon) + "</span>" +
    "<h1 class=\"h-title\">" + esc(page.title) + "</h1>" +
    "<p class=\"byline\">" + esc(SITE.author) + "</p>" +
    "<p class=\"lead\">" + esc(page.intro) + "</p>" +
    "<div class=\"list menu-list\">" + page.children.map(function (c) { return card(c, page.id + "/" + c.id, ""); }).join("") + "</div>" +
    "</div>";
}

function linkBtn(label, url) {
  if (!url) {
    return "<a class=\"btn off\" aria-disabled=\"true\">" + label + "</a>";
  }
  return "<a class=\"btn\" href=\"" + esc(url) + "\" target=\"_blank\" rel=\"noopener\">" + label + "</a>";
}

function introSlide(page) {
  var actions = "";
  if (page.downloads) {
    actions = linkBtn(ic("install") + "<span>دانلود برای اندروید</span>", SITE.androidUrl) +
      linkBtn(ic("install") + "<span>دانلود برای آیفون (iOS)</span>", SITE.iosUrl);
  } else if (page.admin) {
    actions = linkBtn("<span>" + (page.adminLabel || "دریافت لینک از ادمین") + "</span>", SITE.adminUrl);
  }
  return "<div class=\"intro\">" +
    "<span class=\"hero-ico\">" + ic(page.icon) + "</span>" +
    "<h1 class=\"h-title\">" + esc(page.title) + "</h1>" +
    "<p class=\"byline\">" + esc(SITE.author) + "</p>" +
    "<p class=\"lead\">" + esc(page.intro) + "</p>" +
    "<span class=\"chip\">" + fa(page.steps.length) + " مرحله</span>" +
    (page.introShot ? "<div class=\"intro-fit\"><img class=\"shot\" src=\"" + imgSrc(page.introShot.prefix, page.introShot.n, 0) + "\" data-prefix=\"" + page.introShot.prefix + "\" data-n=\"" + page.introShot.n + "\" data-ext=\"0\" alt=\"" + esc(page.title) + "\" decoding=\"async\"></div>" : "") +
    (actions ? "<div class=\"actions\">" + actions + "</div>" : "") +
    "</div>";
}

function stepSlide(page, i) {
  var text = page.steps[i - 1];
  return "<div class=\"step\">" +
    "<div class=\"cap\"><span class=\"badge\">" + fa(i) + "</span><p>" + esc(text) + "</p></div>" +
    "<div class=\"stage\"><div class=\"fit loading\">" +
    "<img class=\"shot\" src=\"" + imgSrc(page.prefix, i, 0) + "\" data-prefix=\"" + page.prefix + "\" data-n=\"" + i + "\" data-ext=\"0\" alt=\"" + esc(text) + "\" decoding=\"async\">" +
    "</div></div></div>";
}

function outroSlide(page) {
  return "<div class=\"outro\">" +
    "<svg class=\"done-ring\" viewBox=\"0 0 64 64\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"32\" cy=\"32\" r=\"28\"/><path d=\"M20 33l8 8 17-18\"/></svg>" +
    "<h2>" + esc(page.done || "آموزش تمام شد") + "</h2>" +
    "</div>";
}

function renderTutorial(page, key, parent, index, startSlide) {
  var n = page.steps.length;
  var last = n + 1;
  var cur = 0;
  var backHref = parent ? "#/" + parent.id : "#/";
  var nextPage = (!parent && !page.noNext && PAGES[index + 1]) ? PAGES[index + 1] : null;

  root.innerHTML =
    "<section class=\"view\">" +
    "<header class=\"bar\"><a class=\"icon-btn\" href=\"" + backHref + "\" aria-label=\"بازگشت\">" + ic("chevR") + "</a><div class=\"bar-title\" id=\"barTitle\"></div></header>" +
    "<div class=\"progress\"><i id=\"barFill\"></i></div>" +
    "<div class=\"slide\" id=\"slide\"></div>" +
    "<footer class=\"dock\" id=\"dock\"></footer>" +
    "</section>";

  var slideEl = document.getElementById("slide");
  var dock = document.getElementById("dock");
  var barTitle = document.getElementById("barTitle");
  var barFill = document.getElementById("barFill");

  function dockHtml(i) {
    if (i === 0) {
      return "<button class=\"btn grow\" type=\"button\" data-act=\"next\">شروع آموزش" + ic("chevL") + "</button>";
    }
    if (i <= n) {
      return "<button class=\"btn ghost sq\" type=\"button\" data-act=\"prev\" aria-label=\"مرحله قبل\">" + ic("chevR") + "</button>" +
        "<button class=\"btn grow\" type=\"button\" data-act=\"next\">" + (i === n ? "پایان" : "مرحله بعد") + ic("chevL") + "</button>";
    }
    if (nextPage) {
      return "<a class=\"btn\" href=\"#/" + nextPage.id + "\">مرحله بعد: " + esc(nextPage.title) + ic("chevL") + "</a>" +
        "<a class=\"btn ghost\" href=\"" + backHref + "\">بازگشت به فهرست</a>";
    }
    return "<a class=\"btn\" href=\"" + backHref + "\">بازگشت به فهرست</a>" +
      "<button class=\"btn ghost\" type=\"button\" data-act=\"restart\">مرور دوباره از اول</button>";
  }

  function persist(i) {
    var d = store.read();
    if (i >= 1 && i <= n) {
      d.last[key] = i;
      d.lastKey = key;
    } else if (i === last) {
      d.done[key] = 1;
      delete d.last[key];
      if (d.lastKey === key) { d.lastKey = ""; }
    } else if (i === 0 && !d.last[key] && d.lastKey === key) {
      d.lastKey = "";
    }
    store.write(d);
    var path = "#/" + key + (i > 0 ? "/" + i : "");
    try { history.replaceState(null, "", path); } catch (e) {
      return;
    }
  }

  function show(i, dir) {
    cur = i;
    var html = i === 0 ? introSlide(page) : (i <= n ? stepSlide(page, i) : outroSlide(page));
    slideEl.className = "slide";
    slideEl.innerHTML = html;
    if (dir) {
      void slideEl.offsetWidth;
      slideEl.classList.add(dir > 0 ? "in-next" : "in-prev");
    }
    slideEl.scrollTop = 0;
    dock.className = "dock" + (i > n ? " col" : "");
    dock.innerHTML = dockHtml(i);
    if (i >= 1 && i <= n) {
      barTitle.innerHTML = "<span class=\"bt\">" + esc(page.title) + "</span><span class=\"bs\">مرحله " + fa(i) + " از " + fa(n) + "</span>";
    } else {
      barTitle.innerHTML = "";
    }
    barFill.style.width = (i === 0 ? 0 : Math.min(i, n) / n * 100) + "%";
    if (i === last) { barFill.style.width = "100%"; }
    if (i < n) {
      var pre = new Image();
      pre.src = imgSrc(page.prefix, i + 1, 0);
    }
    persist(i);
  }

  nav = {
    next: function () { if (cur < last) { show(cur + 1, 1); } },
    prev: function () { if (cur > 0) { show(cur - 1, -1); } }
  };

  dock.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) { return; }
    if (b.dataset.act === "next") { nav.next(); }
    if (b.dataset.act === "prev") { nav.prev(); }
    if (b.dataset.act === "restart") { show(0, -1); }
  });

  var sx = 0;
  var sy = 0;
  slideEl.addEventListener("touchstart", function (e) {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  slideEl.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 56 || Math.abs(dy) > Math.abs(dx) * 0.7) { return; }
    if (dx > 0) { nav.next(); } else { nav.prev(); }
  }, { passive: true });

  show(Math.max(0, Math.min(startSlide, last)), 0);
}

function route() {
  var parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  var slide = 0;
  nav = null;
  if (parts.length && /^\d+$/.test(parts[parts.length - 1])) {
    slide = parseInt(parts.pop(), 10);
  }
  var top = null;
  var topIndex = 0;
  if (parts[0]) {
    PAGES.forEach(function (p, i) { if (p.id === parts[0]) { top = p; topIndex = i; } });
  }
  var title = SITE.brand;
  document.body.style.overflow = "";

  if (!top) {
    renderHome();
  } else if (top.children) {
    var child = null;
    top.children.forEach(function (c) { if (c.id === parts[1]) { child = c; } });
    if (child) {
      renderTutorial(child, top.id + "/" + child.id, top, topIndex, slide);
      title = child.title + " | " + SITE.brand;
    } else {
      renderMenu(top);
      title = top.title + " | " + SITE.brand;
    }
  } else {
    renderTutorial(top, top.id, null, topIndex, slide);
    title = top.title + " | " + SITE.brand;
  }
  document.title = title;
  window.scrollTo(0, 0);
}

document.addEventListener("load", function (e) {
  var el = e.target;
  if (!el || el.tagName !== "IMG" || !el.classList.contains("shot")) { return; }
  el.classList.add("ready");
  if (el.parentNode) { el.parentNode.classList.remove("loading"); }
}, true);

document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG" && el.classList.contains("logo")) {
    var nextLogo = Number(el.dataset.ext) + 1;
    if (nextLogo < SITE.imageExts.length) {
      el.dataset.ext = String(nextLogo);
      el.src = logoSrc(el.dataset.name, nextLogo);
      return;
    }
    var fb = document.createElement("span");
    fb.className = "mark";
    fb.innerHTML = ic("bolt");
    el.parentNode.replaceChild(fb, el);
    return;
  }
  if (el && el.tagName === "IMG" && el.classList.contains("avatar")) {
    var nextAv = Number(el.dataset.ext) + 1;
    if (nextAv < SITE.imageExts.length) {
      el.dataset.ext = String(nextAv);
      el.src = logoSrc(el.dataset.name, nextAv);
    } else {
      el.remove();
    }
    return;
  }
  if (!el || el.tagName !== "IMG" || !el.dataset.prefix) { return; }
  var next = Number(el.dataset.ext) + 1;
  if (next < SITE.imageExts.length) {
    el.dataset.ext = String(next);
    el.src = imgSrc(el.dataset.prefix, el.dataset.n, next);
    return;
  }
  var box = document.createElement("div");
  box.className = "missing";
  box.textContent = SITE.imageDir + "/" + el.dataset.prefix + "-" + el.dataset.n + ".jpg";
  var wrap = el.parentNode;
  wrap.classList.remove("loading");
  wrap.replaceChild(box, el);
}, true);

document.addEventListener("click", function (e) {
  var img = e.target.closest ? e.target.closest(".shot") : null;
  if (!img) { return; }
  var box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = "<img src=\"" + img.currentSrc + "\" alt=\"\">";
  box.addEventListener("click", function () { box.remove(); });
  document.body.appendChild(box);
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    var lb = document.querySelector(".lightbox");
    if (lb) { lb.remove(); }
    return;
  }
  if (!nav) { return; }
  if (e.key === "ArrowLeft") { nav.next(); }
  if (e.key === "ArrowRight") { nav.prev(); }
});

window.addEventListener("hashchange", route);
setFavicon(0);
route();
</script>
</body>
</html>
